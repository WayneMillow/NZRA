<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NZRA | Heights of Winter</title>
    <link rel="stylesheet" href="../foundation-6.2.3/css/foundation.min.css">
    <link rel="stylesheet" href="./css/app_v1.css">
  </head>
  <body>

    <!-- Start Top Bar -->
    <div class="top-bar">
      <div class="top-bar-left">
        <ul class="menu">
          <li class="menu-text">Heights of Winter</li>
        </ul>
      </div>
      
      <div class="top-bar-right">
        <ul class="menu">
          <li><a href="./index.html">Home</a></li>
        </ul>
      </div>
    </div>
    <!-- End Top Bar -->

    <div class="row column text-center">
      <h2>Heights of Winter - 2017</h2>
      <!-- <h3>Time for Trees</h3> -->
      <hr>
    </div>

    <div class="orbit" role="region" aria-label="Last year" data-orbit>
      <ul class="orbit-container">
        <button class="orbit-previous" aria-label="previous"><span class="show-for-sr">Previous Slide</span>&#9664;</button>
        <button class="orbit-next" aria-label="next"><span class="show-for-sr">Next Slide</span>&#9654;</button>
        <li class="orbit-slide is-active">
          <p style="text-align:center;">
            <img class="orbit-image" src="./img/how01.jpg" alt="This year">
          </p>
        </li>
        <li class="orbit-slide">
          <p style="text-align:center;">
            <img class="orbit-image" src="./img/how02.jpg" alt="This year">
          </p>
        </li>
        <li class="orbit-slide">
          <p style="text-align:center;">
            <img class="orbit-image" src="./img/how03.jpg" alt="This year">
          </p>
        </li>
        <li class="orbit-slide">
          <p style="text-align:center;">
            <img class="orbit-image" src="./img/how04.jpg" alt="This year">
          </p>
        </li>
        <li class="orbit-slide">
          <p style="text-align:center;">
            <img class="orbit-image" src="./img/how05.jpg" alt="This year">
          </p>
        </li>
      </ul>
    </div>

    <div class="row column text-center">
      <hr>
      <p>Colin Dixon setting the 2017 course with Douglas Woods</p>
    </div>

    <script src="../foundation-6.2.3/js/vendor/jquery.js"></script>
    <script src="../foundation-6.2.3/js/vendor/foundation.js"></script>
    <script>
      $(document).foundation();
    </script>
  </body>
</html>
