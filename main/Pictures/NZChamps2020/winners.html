<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NZ Championships 2020" />
    <title>NZRA | NZChamps 2020 | Pictures</title>
    <link rel="stylesheet" href="../../../foundation-6.6.3/css/foundation.min.css" />
    <link rel="stylesheet" href="./css/winners_v1.css" />
  </head>
  <body>

  <div class="grid-container">  
  
    <div id="header" class="grid-x grid-margin-x">
      <div class="cell">
      	<h1>New Zealand Rogaine Championships 2020</h1>
      	<h2>November 7<sup>th</sup> &amp; 8<sup>th</sup></h2>
      	<h3>Section Winners</h3>
      </div>
    </div>

    <div id="main" class="grid-x grid-margin-x">
      <div class="cell">
		<div class="orbit" role="region" aria-label="Favorite Space Pictures" data-orbit>
		  <div class="orbit-wrapper">
		    <div class="orbit-controls">
		      <button class="orbit-previous"><span class="show-for-sr">Previous Slide</span>&#9664;&#xFE0E;</button>
		      <button class="orbit-next"><span class="show-for-sr">Next Slide</span>&#9654;&#xFE0E;</button>
		    </div>
		    <ul class="orbit-container">
		      <li class="is-active orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./MJwinners.jpg" alt="MJwinners">
		          <figcaption class="orbit-caption">Men Junior - Eddie Swain, William Seymour</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./WJwinners.jpg" alt="WJwinners">
		          <figcaption class="orbit-caption">Women Junior - Zoe Marshall-Means, Marina Comeskey</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./XJwinners.jpg" alt="XJwinners">
		          <figcaption class="orbit-caption">Mixed Junior - Will Tidswell, Jenna Tidswell</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./MV_MOwinners.jpg" alt="MOwinners">
		          <figcaption class="orbit-caption">Men Open &amp; Veteran - Chris Forne, Greig Hamilton</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./WOwinners.jpg" alt="WOwinners">
		          <figcaption class="orbit-caption">Women Open - Kelly Munro, Hannah Norton</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./XOwinners.jpg" alt="XOwinners">
		          <figcaption class="orbit-caption">Mixed Open - Jo Williams, Tim Farrant</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./WSV_WVwinners.jpg" alt="WVwinners">
		          <figcaption class="orbit-caption">Women Veteran &amp; Super Veteran - Wendy Riach, Jenni Blyleven</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./MSVwinners.jpg" alt="MSVwinners">
		          <figcaption class="orbit-caption">Men Super Veteran - Stephen John, Simon Woods</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./XSVwinners.jpg" alt="XSVwinners">
		          <figcaption class="orbit-caption">Mixed Super Veteran - Vivienne Prince, Dave Armstrong</figcaption>
		        </figure>
		      </li>
		      <li class="orbit-slide">
		        <figure class="orbit-figure">
		          <img class="orbit-image" src="./WUVwinners.jpg" alt="WUVwinners">
		          <figcaption class="orbit-caption">Women Ultra Veteran - Kathrin Mueller, Val Rogers</figcaption>
		        </figure>
		      </li>
		    </ul>
		  </div>
		  <nav class="orbit-bullets">
		    <button class="is-active" data-slide="0">
		      <span class="show-for-sr">First slide details.</span>
		      <span class="show-for-sr" data-slide-active-label>Current Slide</span>
		    </button>
		    <button data-slide="1"><span class="show-for-sr">Second slide details.</span></button>
		    <button data-slide="2"><span class="show-for-sr">Third slide details.</span></button>
		    <button data-slide="3"><span class="show-for-sr">Fourth slide details.</span></button>
		    <button data-slide="4"><span class="show-for-sr">Fifth slide details.</span></button>
		    <button data-slide="5"><span class="show-for-sr">Sixth slide details.</span></button>
		    <button data-slide="6"><span class="show-for-sr">Seventh slide details.</span></button>
		    <button data-slide="7"><span class="show-for-sr">Eighth slide details.</span></button>
		    <button data-slide="8"><span class="show-for-sr">Nineth slide details.</span></button>
		    <button data-slide="9"><span class="show-for-sr">Tenth slide details.</span></button>
		  </nav>
		</div>
		Prizes presented by Peter Squires
		<br>Photographs by <a href="https://www.facebook.com/trackmenzadventure/">TrackMe Adventures</a> (Tony Glentworth and David Tait)
      </div>
	</div>
	
    <div id="footer" class="grid-x grid-margin-x ">
      <div class="cell large-6 small-12">
        <p>&copy; Copyright 2020 NZRA</p>
      </div>
      <div class="cell large-6 small-12">
         <a target=_blank href="http://www.rogaine.org.nz">NZRA website</a>
      </div>
    </div>
    
  </div>
  
  <script src="../../../foundation-6.6.3/js/vendor/jquery.js"></script>
  <script src="../../../foundation-6.6.3/js/vendor/foundation.min.js"></script>
  <script>
    $(document).foundation();
  </script>
    
  </body>
</html>
